<body class="text-stone-900">
    <div id="root"></div>

    <!-- ============================================================================
         PART 1: GLOBAL KHQR ENGINE, AUTO-DECODER, MTPROTO & PAYWAY VERIFIER
         Copy this <script> block into your target application's global scope.
         ============================================================================ -->
    <script>
        // Haversine formula to calculate customer distance in meters (Used by "Require KHQR Payment for Remote Orders")
        window.calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3; // Earth radius in meters
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        };

        // --- Global EMVCo / Bakong KHQR & ABA PayWay Engine ---
        window.SolarisKHQREngine = {
            _qrDataUrlCache: new Map(),

            // 1. 0ms Instant Client-Side QR Code Renderer
            renderInstantQRDataURL(payloadText, sizePx = 320, marginModules = 2) {
                const cleanPayload = String(payloadText || '').trim();
                if (!cleanPayload) return '';

                const cacheKey = `${cleanPayload}__${sizePx}__${marginModules}`;
                if (this._qrDataUrlCache.has(cacheKey)) {
                    return this._qrDataUrlCache.get(cacheKey);
                }

                try {
                    if (typeof window.qrcode === 'function') {
                        const qr = window.qrcode(0, 'M');
                        qr.addData(cleanPayload);
                        qr.make();

                        const moduleCount = qr.getModuleCount();
                        const totalModules = moduleCount + marginModules * 2;
                        const canvas = document.createElement('canvas');
                        canvas.width = sizePx;
                        canvas.height = sizePx;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, sizePx, sizePx);

                        const scale = sizePx / totalModules;
                        ctx.fillStyle = '#000000';

                        for (let row = 0; row < moduleCount; row++) {
                            for (let col = 0; col < moduleCount; col++) {
                                if (qr.isDark(row, col)) {
                                    const x = Math.floor((col + marginModules) * scale);
                                    const y = Math.floor((row + marginModules) * scale);
                                    const w = Math.ceil((col + marginModules + 1) * scale) - x;
                                    const h = Math.ceil((row + marginModules + 1) * scale) - y;
                                    ctx.fillRect(x, y, w, h);
                                }
                            }
                        }

                        const dataUrl = canvas.toDataURL('image/png');
                        if (this._qrDataUrlCache.size > 150) {
                            const oldestKey = this._qrDataUrlCache.keys().next().value;
                            this._qrDataUrlCache.delete(oldestKey);
                        }
                        this._qrDataUrlCache.set(cacheKey, dataUrl);
                        return dataUrl;
                    }
                } catch (err) {
                    console.warn('Local QR generator warning, using fallback:', err);
                }

                return `https://api.qrserver.com/v1/create-qr-code/?size=${sizePx}x${sizePx}&margin=${marginModules * 3}&data=${encodeURIComponent(cleanPayload)}`;
            },

            // 2. Standard EMVCo CRC-16/CCITT-FALSE (Polynomial 0x1021, Initial 0xFFFF)
            crc16(str) {
                let crc = 0xFFFF;
                for (let i = 0; i < str.length; i++) {
                    crc ^= (str.charCodeAt(i) & 0xFF) << 8;
                    for (let j = 0; j < 8; j++) {
                        if ((crc & 0x8000) !== 0) {
                            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                        } else {
                            crc = (crc << 1) & 0xFFFF;
                        }
                    }
                }
                return crc.toString(16).toUpperCase().padStart(4, '0');
            },

            // 3. Parses an EMVCo TLV string into [{ tag, length, value }]
            parseTLV(payload) {
                const result = [];
                if (!payload || typeof payload !== 'string') return result;
                let idx = 0;
                while (idx + 4 <= payload.length) {
                    const tag = payload.slice(idx, idx + 2);
                    const len = parseInt(payload.slice(idx + 2, idx + 4), 10);
                    if (isNaN(len) || len < 0 || idx + 4 + len > payload.length) break;
                    const value = payload.slice(idx + 4, idx + 4 + len);
                    result.push({ tag, length: len, value });
                    idx += 4 + len;
                }
                return result;
            },

            // 4. Formats a single EMVCo TLV entry (Tag + 2-digit Length + Value)
            formatTLV(tag, value) {
                const valStr = String(value ?? '');
                const lenStr = String(valStr.length).padStart(2, '0');
                return `${tag}${lenStr}${valStr}`;
            },

            // 5. Extracts Merchant Name (Tag 59), Merchant City (Tag 60), and MID from an EMVCo KHQR payload
            extractMerchantInfoFromEMV(emvPayload) {
                if (!emvPayload || typeof emvPayload !== 'string' || !emvPayload.startsWith('000201')) {
                    return { merchantName: null, merchantCity: null, mid: null };
                }
                const parsed = this.parseTLV(emvPayload);
                const tag29Or30 = parsed.find(t => t.tag === '30' || t.tag === '29');
                const tag59 = parsed.find(t => t.tag === '59');
                const tag60 = parsed.find(t => t.tag === '60');
                let mid = null;
                if (tag29Or30 && tag29Or30.value) {
                    const subTags = this.parseTLV(tag29Or30.value);
                    const midSub = subTags.find(st => st.tag === '01');
                    if (midSub && midSub.value) mid = String(midSub.value).trim();
                }
                return {
                    merchantName: tag59?.value ? String(tag59.value).trim() : null,
                    merchantCity: tag60?.value ? String(tag60.value).trim() : null,
                    mid
                };
            },

            // 6. Transforms a static EMVCo KHQR string into an amount-locked Dynamic KHQR compliant with NBC Bakong KHQR v1.0.20+
            // Includes Mandatory Tag 99 (Subtag 00 = Creation Unix ms, Subtag 01 = Expiration Unix ms)
            generateDynamicKHQR(basePayload, amountValue, invoiceNo = '', currency = 'KHR', expirationMinutes = 15, customTimestamps = null) {
                if (!basePayload || typeof basePayload !== 'string' || !basePayload.startsWith('000201')) {
                    return null;
                }
                const parsed = this.parseTLV(basePayload);
                if (parsed.length < 4) return null;

                const isUsd = String(currency || 'KHR').toUpperCase() === 'USD';
                const targetCurrencyCode = isUsd ? '840' : '116'; // 840 = USD, 116 = KHR (ISO 4217)
                const rawNum = Number(amountValue) || 0;
                const formattedAmountStr = isUsd
                    ? (rawNum > 0 ? rawNum.toFixed(2) : '')
                    : (Math.round(rawNum) > 0 ? String(Math.round(rawNum)) : '');
                const hasPositiveAmount = rawNum > 0 && formattedAmountStr.length > 0;

                const cleanInvoice = String(invoiceNo || '').replace(/[^a-zA-Z0-9\-_]/g, '').slice(0, 25);

                const nowMs = (customTimestamps && Number(customTimestamps.createdAtMs) > 0)
                    ? Math.floor(Number(customTimestamps.createdAtMs))
                    : Date.now();
                const validDurationMs = Math.max(2, Number(expirationMinutes) || 15) * 60 * 1000;
                const expMs = (customTimestamps && Number(customTimestamps.expiresAtMs) > nowMs)
                    ? Math.floor(Number(customTimestamps.expiresAtMs))
                    : (nowMs + validDurationMs);

                const tag99Value = this.formatTLV('00', String(nowMs)) + this.formatTLV('01', String(expMs));

                const filtered = parsed.filter(t => t.tag !== '63' && t.tag !== '99');
                const resultTags = [];
                let hasTag01 = false, hasTag53 = false, hasTag54 = false, hasTag62 = false;

                filtered.forEach(item => {
                    if (item.tag === '01') {
                        hasTag01 = true;
                        resultTags.push({ tag: '01', value: hasPositiveAmount ? '12' : item.value });
                    } else if (item.tag === '53') {
                        hasTag53 = true;
                        resultTags.push({ tag: '53', value: targetCurrencyCode });
                    } else if (item.tag === '54') {
                        hasTag54 = true;
                        if (hasPositiveAmount) {
                            resultTags.push({ tag: '54', value: formattedAmountStr });
                        }
                    } else if (item.tag === '62') {
                        hasTag62 = true;
                        if (cleanInvoice) {
                            const subTags = this.parseTLV(item.value).filter(st => st.tag !== '01');
                            subTags.unshift({ tag: '01', value: cleanInvoice });
                            const rebuilt62 = subTags.map(st => this.formatTLV(st.tag, st.value)).join('');
                            resultTags.push({ tag: '62', value: rebuilt62 });
                        } else {
                            resultTags.push({ tag: '62', value: item.value });
                        }
                    } else {
                        resultTags.push({ tag: item.tag, value: item.value });
                    }
                });

                if (!hasTag01) {
                    resultTags.splice(1, 0, { tag: '01', value: hasPositiveAmount ? '12' : '11' });
                }
                if (!hasTag53) {
                    const idx52 = resultTags.findIndex(t => t.tag === '52');
                    const insertPos53 = idx52 !== -1 ? idx52 + 1 : resultTags.length;
                    resultTags.splice(insertPos53, 0, { tag: '53', value: targetCurrencyCode });
                }
                if (!hasTag54 && hasPositiveAmount) {
                    const idx53 = resultTags.findIndex(t => t.tag === '53');
                    const insertPos = idx53 !== -1 ? idx53 + 1 : resultTags.length;
                    resultTags.splice(insertPos, 0, { tag: '54', value: formattedAmountStr });
                }
                if (!hasTag62 && cleanInvoice) {
                    const sub01 = this.formatTLV('01', cleanInvoice);
                    resultTags.push({ tag: '62', value: sub01 });
                }
                if (hasPositiveAmount) {
                    resultTags.push({ tag: '99', value: tag99Value });
                }

                const bodyWithoutCrc = resultTags.map(t => this.formatTLV(t.tag, t.value)).join('') + '6304';
                const crcHex = this.crc16(bodyWithoutCrc);
                return bodyWithoutCrc + crcHex;
            },

            // 7. Auto-Decodes an uploaded Static ABA KHQR image using multi-pass jsQR + native BarcodeDetector
            // (Handles full ABA PAY standee posters with red Bakong center logos)
            async decodeQRFromImageFile(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = async () => {
                            let emvPayload = null;

                            // PASS 1: Native browser BarcodeDetector API
                            if ('BarcodeDetector' in window) {
                                try {
                                    const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
                                    const detected = await detector.detect(img);
                                    if (detected && detected.length > 0 && detected[0].rawValue) {
                                        emvPayload = detected[0].rawValue.trim();
                                    }
                                } catch (bdErr) {}
                            }

                            // PASS 2: Multi-scale & cropped jsQR scanning
                            if (!emvPayload && window.jsQR) {
                                const tryDecodeCanvas = (sourceX, sourceY, sourceW, sourceH, targetSize, highContrast = false) => {
                                    const c = document.createElement('canvas');
                                    let w = sourceW;
                                    let h = sourceH;
                                    if (w > targetSize || h > targetSize) {
                                        if (w > h) { h = Math.round((h * targetSize) / w); w = targetSize; }
                                        else { w = Math.round((w * targetSize) / h); h = targetSize; }
                                    }
                                    c.width = w;
                                    c.height = h;
                                    const ctx = c.getContext('2d');
                                    ctx.fillStyle = '#FFFFFF';
                                    ctx.fillRect(0, 0, w, h);
                                    ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, 0, 0, w, h);
                                    const imgData = ctx.getImageData(0, 0, w, h);

                                    if (highContrast) {
                                        const d = imgData.data;
                                        for (let i = 0; i < d.length; i += 4) {
                                            const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                                            const v = lum < 145 ? 0 : 255;
                                            d[i] = v; d[i + 1] = v; d[i + 2] = v;
                                        }
                                    }

                                    const code = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
                                    return code && code.data ? code.data.trim() : null;
                                };

                                const iw = img.width;
                                const ih = img.height;
                                const scanPasses = [
                                    () => tryDecodeCanvas(0, 0, iw, ih, 1000, false),
                                    () => tryDecodeCanvas(0, 0, iw, ih, 700, false),
                                    () => tryDecodeCanvas(0, 0, iw, ih, 1200, true),
                                    () => tryDecodeCanvas(iw * 0.15, ih * 0.22, iw * 0.70, ih * 0.52, 800, false),
                                    () => tryDecodeCanvas(iw * 0.15, ih * 0.22, iw * 0.70, ih * 0.52, 800, true),
                                    () => tryDecodeCanvas(iw * 0.20, ih * 0.28, iw * 0.60, ih * 0.44, 700, false),
                                    () => tryDecodeCanvas(iw * 0.20, ih * 0.28, iw * 0.60, ih * 0.44, 700, true)
                                ];

                                for (const attempt of scanPasses) {
                                    const res = attempt();
                                    if (res && res.startsWith('000201')) {
                                        emvPayload = res;
                                        break;
                                    }
                                }
                            }

                            // Generate lightweight WebP fallback image (~360px)
                            const thumbCanvas = document.createElement('canvas');
                            const thumbMax = 360;
                            let tw = img.width;
                            let th = img.height;
                            if (tw > thumbMax || th > thumbMax) {
                                if (tw > th) { th = Math.round((th * thumbMax) / tw); tw = thumbMax; }
                                else { tw = Math.round((tw * thumbMax) / th); th = thumbMax; }
                            }
                            thumbCanvas.width = tw;
                            thumbCanvas.height = th;
                            thumbCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
                            const compressedDataUrl = thumbCanvas.toDataURL('image/webp', 0.65);

                            resolve({ emvPayload, compressedDataUrl });
                        };
                        img.onerror = () => resolve({ emvPayload: null, compressedDataUrl: null });
                        img.src = e.target.result;
                    };
                    reader.onerror = () => resolve({ emvPayload: null, compressedDataUrl: null });
                    reader.readAsDataURL(file);
                });
            },

            // 8. Parses official ABA PayWay Telegram Bot messages (both KHR ៛ and USD $)
            parseABAPayWayMessage(rawText) {
                if (!rawText || typeof rawText !== 'string') return { isValid: false };
                const cleanText = rawText.replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();

                const strictRegex = /(?:(៛|\$|KHR|USD)\s*([0-9,]+(?:\.[0-9]{1,2})?))\s+paid by\s+(.+?)(?:\s*\(\s*\*\s*([0-9A-Za-z]+)\s*\))?\s+on\s+(.+?)\s+via\s+(.+?)\s+at\s+(.+?)(?:\.\s*|\s+)Trx\.?\s*ID:\s*([0-9A-Za-z]+)[,\s]+APV:\s*([0-9A-Za-z]+)/i;
                const match = cleanText.match(strictRegex);
                if (match) {
                    const rawSymbol = match[1].toUpperCase();
                    const currency = (rawSymbol === '៛' || rawSymbol === 'KHR') ? 'KHR' : 'USD';
                    const amount = parseFloat(match[2].replace(/,/g, ''));
                    const cleanedPayer = match[3].replace(/\(\s*\*\s*[0-9A-Za-z]+\s*\)\s*$/, '').trim();
                    const paidAtStr = match[5].trim();
                    return {
                        isValid: !isNaN(amount) && amount > 0,
                        currency,
                        amount,
                        payerName: cleanedPayer || match[3].trim(),
                        maskedAccount: match[4] ? `*${match[4].trim()}` : '*ABA',
                        paidAtStr,
                        paidTimestamp: Date.now(),
                        paymentChannel: match[6].trim(),
                        merchantName: match[7].replace(/\.$/, '').trim(),
                        trxId: match[8].trim(),
                        apv: match[9].replace(/\.$/, '').trim(),
                        rawText: cleanText
                    };
                }

                // Resilient fallback extractor
                const amtMatch = cleanText.match(/(?:(៛|\$|KHR|USD)\s*([0-9,]+(?:\.[0-9]{1,2})?))\s*(?:paid by|received from)/i);
                const trxMatch = cleanText.match(/Trx\.?\s*ID\s*[:#]?\s*([0-9A-Za-z]+)/i);
                const apvMatch = cleanText.match(/APV\s*[:#]?\s*([0-9A-Za-z]+)/i);
                if (amtMatch && (trxMatch || apvMatch)) {
                    const rawSymbol = amtMatch[1].toUpperCase();
                    const currency = (rawSymbol === '៛' || rawSymbol === 'KHR') ? 'KHR' : 'USD';
                    const amount = parseFloat(amtMatch[2].replace(/,/g, ''));
                    const payerMatch = cleanText.match(/(?:paid by|received from)\s+([^(]+?)(?:\s*\(\s*\*\s*([0-9A-Za-z]+)\s*\)|\s+on\s+|\s+via\s+)/i);
                    const onMatch = cleanText.match(/\bon\s+(.+?)\s+via\s+/i);
                    const atMatch = cleanText.match(/\bat\s+(.+?)(?:\.\s*Trx|\s+Trx)/i);
                    const generatedId = trxMatch ? trxMatch[1].trim() : `APV-${apvMatch[1].trim()}`;
                    const paidAtStr = onMatch ? onMatch[1].trim() : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    return {
                        isValid: !isNaN(amount) && amount > 0,
                        currency,
                        amount,
                        payerName: payerMatch ? payerMatch[1].trim() : 'ABA Customer',
                        maskedAccount: (payerMatch && payerMatch[2]) ? `*${payerMatch[2].trim()}` : '*ABA',
                        paidAtStr,
                        paidTimestamp: Date.now(),
                        paymentChannel: 'ABA PAY',
                        merchantName: atMatch ? atMatch[1].replace(/\.$/, '').trim() : '',
                        trxId: generatedId,
                        apv: apvMatch ? apvMatch[1].replace(/\.$/, '').trim() : generatedId.slice(-6),
                        rawText: cleanText
                    };
                }

                return { isValid: false };
            },

            // 9. Validates GramJS StringSession format
            isValidGramJsSessionString(str) {
                if (!str || typeof str !== 'string') return false;
                const cleaned = str.trim().replace(/^["']|["']$/g, '').replace(/\s+/g, '');
                return cleaned.length >= 100 && cleaned[0] === '1' && /^[A-Za-z0-9+/=_-]+$/.test(cleaned);
            },

            // 10. Broadcasts a detected ABA payment into the live feed (and Firestore if connected)
            async broadcastDetectedAbaPayment(parsed, chatId = '', sourceLabel = 'Telegram Live', messageDateMs = null) {
                if (!parsed || !parsed.isValid || !parsed.trxId) return;
                const trxId = String(parsed.trxId).trim();
                const effectiveReceivedAt = Number(messageDateMs) > 0 ? Number(messageDateMs) : Date.now();

                const enrichedParsed = {
                    ...parsed,
                    chatId: String(chatId || parsed.chatId || '').trim(),
                    receivedAt: effectiveReceivedAt,
                    paidTimestamp: effectiveReceivedAt
                };

                const entry = {
                    updateId: trxId,
                    messageId: trxId,
                    chatId: enrichedParsed.chatId,
                    chatTitle: sourceLabel,
                    chatType: 'live_bridge',
                    senderName: 'PayWay by ABA',
                    isBotSender: true,
                    date: effectiveReceivedAt,
                    text: enrichedParsed.rawText,
                    parsedAba: enrichedParsed,
                    fromFirestore: true
                };

                if (window.SolarisPayWayVerifier) {
                    window.SolarisPayWayVerifier.inMemoryAbaPayments.set(trxId, entry);
                    window.SolarisPayWayVerifier.notifySubscribers(entry);
                }
            },

            // 11. Fetches unclaimed ABA payments from memory / Telegram Bot / Firestore (`aba_payments`)
            async fetchRecentAbaPaymentsFromFirestore(filterChatId = '', shopId = '', includeClaimed = false) {
                const cleanFilterId = String(filterChatId || '').trim();
                const strippedFilterId = cleanFilterId.replace(/^-100/, '').replace(/^-/, '');
                const allMessages = Array.from(window.SolarisPayWayVerifier.inMemoryAbaPayments.values())
                    .filter(e => includeClaimed || !e.claimedByOrderId)
                    .sort((a, b) => b.date - a.date);

                const filteredMessages = allMessages.filter(entry => {
                    if (!cleanFilterId || !entry.chatId) return true;
                    const strippedDocChatId = String(entry.chatId).replace(/^-100/, '').replace(/^-/, '');
                    if (entry.chatId === cleanFilterId || strippedDocChatId === strippedFilterId) return true;
                    return entry.parsedAba?.isValid === true;
                });

                return {
                    ok: true,
                    sourceMode: 'FIRESTORE_AND_BOT',
                    messages: filteredMessages,
                    allAbaMessages: allMessages,
                    unfilteredAbaCount: allMessages.length,
                    totalRawUpdates: filteredMessages.length
                };
            }
        };

        // --- Global Telegram Bot Alerts Helper (Used by "Auto-Fill Token from Telegram Bot Alerts") ---
        window.SolarisTelegramNode = window.SolarisTelegramNode || {
            async getEffectiveConfig(shop) {
                const branchCfg = shop?.telegramBotConfig;
                if (branchCfg && branchCfg.botToken) return branchCfg;
                try {
                    const cached = localStorage.getItem('solaris_telegram_bot_global');
                    if (cached) return JSON.parse(cached);
                } catch (e) {}
                return branchCfg || { enabled: false, botToken: '', chatId: '' };
            }
        };

        // --- Built-In Browser Telegram MTProto Live Listener (GramJS) ---
        window.SolarisBrowserMTProto = window.SolarisBrowserMTProto || {
            client: null,
            isConnected: false,
            isConnecting: false,
            connectedUser: null,
            lastError: null,
            statusListeners: new Set(),

            notifyListeners() {
                const state = {
                    isConnected: this.isConnected,
                    isConnecting: this.isConnecting,
                    connectedUser: this.connectedUser,
                    lastError: this.lastError
                };
                this.statusListeners.forEach(fn => {
                    try { fn(state); } catch (e) {}
                });
            },

            async loadGramJS() {
                if (window.GramJSModule) return window.GramJSModule;
                if (typeof window.global === 'undefined') window.global = window;
                if (typeof window.Buffer === 'undefined') {
                    try {
                        const bufMod = await import('https://esm.sh/buffer@6.0.3');
                        window.Buffer = bufMod.Buffer || bufMod.default?.Buffer;
                    } catch (e) {}
                }
                const mod = await import('https://esm.sh/telegram@2.22.2?bundle&target=es2022');
                const rootObj = mod.TelegramClient ? mod : (mod.default || mod);
                window.GramJSModule = {
                    TelegramClient: rootObj.TelegramClient,
                    StringSession: rootObj.sessions?.StringSession,
                    NewMessage: rootObj.events?.NewMessage
                };
                return window.GramJSModule;
            },

            async startInteractiveBrowserLogin(apiId, apiHash, phoneNumber, getCodeCallback, getPasswordCallback) {
                const cleanApiId = Number(String(apiId || '').trim());
                const cleanApiHash = String(apiHash || '').trim();
                const cleanPhone = String(phoneNumber || '').trim();
                if (!cleanApiId || !cleanApiHash || !cleanPhone) {
                    return { ok: false, error: 'Please fill in Telegram API ID, API Hash, and Phone Number (+855...) first.' };
                }
                this.isConnecting = true;
                this.lastError = null;
                this.notifyListeners();
                try {

                if (!this.client || !this.isConnected) return { found: 0, dialogs: [] };
                try {
                    const dialogs = await this.client.getDialogs({ limit: 15 });
                    let foundCount = 0;
                    const dialogSummaries = [];
                    for (const d of dialogs) {
                        const chatId = String(d.id || '');

                            const parsed = window.SolarisKHQREngine.parseABAPayWayMessage(txt);
                            if (parsed && parsed.isValid && parsed.trxId) {

                                await window.SolarisKHQREngine.broadcastDetectedAbaPayment(parsed, chatId, `MTProto (${title})`, msgDateMs);

                if (typeof callback !== 'function') return () => {};

            },

                });
            },

            unregisterKhqrIntent(intentId) {

            // Checks if a parsed ABA PayWay message matches a pending KHQR order
            // Validates Amount (KHR or USD), Chronological Recency Gate (< 5 min & after QR generation), and Optional APV Ref
            doesMessageMatchOrder(parsedAba, order, shop) {
                if (!parsedAba || !parsedAba.isValid || !order) return false;
                if (order.paymentStatus === 'Paid' || order.status === 'Cancelled') return false;

                // 1. Chronological & Recency Gate (< 5 mins configurable)
                if (!order.bypassRecencyGate) {
                    const now = Date.now();
                    const maxRecencyMinutes = Math.max(1, Number(shop?.khqrConfig?.autoVerifyWindowMinutes) || 5);
                    const maxAgeMs = maxRecencyMinutes * 60 * 1000;
                    const effectivePaymentMs = Number(parsedAba.receivedAt || parsedAba.paidTimestamp || now);

                    if (effectivePaymentMs > 0 && (now - effectivePaymentMs) > maxAgeMs) {
                        return false;
                    }
                    const qrInitiatedAt = Number(order.khqrInitiatedAt || order.createdAt || 0);
                    if (qrInitiatedAt > 0 && effectivePaymentMs < (qrInitiatedAt - 45000)) {
                        return false;
                    }
                }

                // 2. Customer Optional APV / Reference Match
                if (order.khqrCustomerRef && String(order.khqrCustomerRef).trim().length >= 3) {
                    const refClean = String(order.khqrCustomerRef).trim().toUpperCase();
                    const apvMatch = String(parsedAba.apv || '').toUpperCase().includes(refClean);
                    const trxMatch = String(parsedAba.trxId || '').toUpperCase().includes(refClean);
                    if (!apvMatch && !trxMatch) return false;
                }

                // 3. Exact Amount Matching (Supports both KHR and USD)
                const expectedKhr = Math.round(Number(order.khqrExpectedKhr || order.totalAmount || 0));
                const rate = Math.max(100, Number(shop?.khqrConfig?.exchangeRate) || 4000);
                const expectedUsd = Number(order.khqrExpectedUsd || (expectedKhr / rate));

                if (parsedAba.currency === 'KHR') {
                    return Math.round(Number(parsedAba.amount)) === expectedKhr;
                } else if (parsedAba.currency === 'USD') {
                    return Math.abs(Number(parsedAba.amount) - expectedUsd) <= 0.02;
                }
                return false;
            }

        function KHQRPaymentModal({ shop, cartTotal, previewInvoiceNo, onConfirmPaid, onClose }) {

            const [khqrExpiresAt, setKhqrExpiresAt] = useState(() => Date.now() + validDurationSec * 1000);
            const [remainingValidSec, setRemainingValidSec] = useState(validDurationSec);

            const cfg = shop?.khqrConfig || {};
            const accountName = (cfg.accountName || shop?.name || 'SOLARIS CAFE').trim();
            const khrAccount = cfg.khrAccount || '070 268 811';
            const usdAccount = cfg.usdAccount || '077 268 811';
            const exchangeRate = Math.max(100, Number(cfg.exchangeRate) || 4000);
            const usdEquivalent = (Number(cartTotal || 0) / exchangeRate).toFixed(2);
            const activeQrAmount = selectedQrCurrency === 'USD' ? Number(usdEquivalent) : Number(cartTotal || 0);

            const dynamicPayload = useMemo(() => {
                if (!cfg.baseEmvPayload) return null;
                const bankSafetyExpiryMs = Math.max(khqrExpiresAt, khqrInitiatedAt + 15 * 60 * 1000);
                return window.SolarisKHQREngine.generateDynamicKHQR(
                    cfg.baseEmvPayload,
                    activeQrAmount,
                    tempInvoiceNo,
                    selectedQrCurrency,
                    15,
                    { createdAtMs: khqrInitiatedAt, expiresAtMs: bankSafetyExpiryMs }
                );
            }, [cfg.baseEmvPayload, activeQrAmount, tempInvoiceNo, selectedQrCurrency, khqrInitiatedAt, khqrExpiresAt]);

            useEffect(() => {
                const tick = () => setRemainingValidSec(Math.max(0, Math.ceil((khqrExpiresAt - Date.now()) / 1000)));
                tick();
                const id = setInterval(tick, 1000);
                return () => clearInterval(id);
            }, [khqrExpiresAt]);

            // Subscribe to Live ABA PayWay feed while modal is open
            useEffect(() => {
                const unsub = window.SolarisPayWayVerifier.subscribe(() => {
                    if (hasAutoConfirmedRef.current) return;
                    const entries = Array.from(window.SolarisPayWayVerifier.inMemoryAbaPayments.values())
                        .filter(e => !e.claimedByOrderId && e.parsedAba?.isValid);

                    const mockOrder = {
                        id: tempInvoiceNo,
                        paymentStatus: 'Unpaid',
                        status: 'New',
                        totalAmount: Number(cartTotal || 0),
                        khqrExpectedKhr: Number(cartTotal || 0),
                        khqrExpectedUsd: Number(usdEquivalent),
                        khqrCustomerRef: apvRefInput.trim(),
                        khqrInitiatedAt
                    };

                    for (const entry of entries) {
                        if (window.SolarisPayWayVerifier.doesMessageMatchOrder(entry.parsedAba, mockOrder, shop)) {
                            hasAutoConfirmedRef.current = true;
                            setVerifiedAbaPayload(entry.parsedAba);
                            setLocalToast("Payment Verified! Sending to Kitchen...");
                            setTimeout(() => {
                                onConfirmPaid(entry.parsedAba.apv, entry.parsedAba);
                            }, 900);
                            return;
                        }
                    }
                });
                return () => unsub();
            }, [cartTotal, usdEquivalent, apvRefInput, khqrInitiatedAt, shop]);

            // High-Resolution (900x1220) HTML5 Canvas KHQR PNG Generator
            const handleDownloadQrCard = async () => {
                if (isDownloadingQr) return;
                setIsDownloadingQr(true);
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 900;
                    canvas.height = 1220;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 900, 1220);
                    ctx.fillStyle = '#E1232E';
                    ctx.fillRect(0, 0, 900, 140);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 52px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`KHQR • ABA PAY (${selectedQrCurrency})`, 450, 88);

                    ctx.fillStyle = '#1c1917';
                    ctx.font = 'bold 34px sans-serif';
                    ctx.fillText(accountName.toUpperCase(), 450, 210);

                    ctx.font = '900 64px sans-serif';
                    ctx.fillText(selectedQrCurrency === 'USD' ? `$${usdEquivalent}` : `${Number(cartTotal).toLocaleString()} ៛`, 450, 290);

                    const qrSrc = dynamicPayload
                        ? window.SolarisKHQREngine.renderInstantQRDataURL(dynamicPayload, 560, 2)
                        : window.SolarisKHQREngine.renderInstantQRDataURL(`ABA PAY | ${accountName} | ${cartTotal} KHR`, 560, 2);

                    const img = await new Promise(res => {
                        const i = new Image();
                        i.onload = () => res(i);
                        i.onerror = () => res(null);
                        i.src = qrSrc;
                    });
                    if (img) ctx.drawImage(img, 170, 350, 560, 560);

                    ctx.fillStyle = '#57534e';
                    ctx.font = 'bold 26px monospace';
                    ctx.fillText(`Inv: ${tempInvoiceNo}  •  KHR: ${khrAccount}  •  USD: ${usdAccount}`, 450, 980);

                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = `KHQR_${tempInvoiceNo}.png`;
                    link.click();
                    setLocalToast("QR Image saved!");
                    setTimeout(() => setLocalToast(''), 3000);
                } finally {
                    setIsDownloadingQr(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-[120] flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl w-full max-w-md p-5 sm:p-6 shadow-2xl animate-fade-in relative my-auto">

                                    </span>
                                    Scan or Save ABA KHQR
                                </h3>
                                <p className="text-xs text-stone-500 mt-0.5">Scan with ABA Mobile or any Bakong banking app</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Session & Countdown Bar */}
                        <div className="mb-3 px-3 py-2 rounded-2xl bg-stone-900 text-white flex items-center justify-between text-[11px]">
                            <span className="font-mono font-black text-amber-300">{tempInvoiceNo}</span>
                            <span className="font-mono font-black px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">
                                <i className="fa-regular fa-clock mr-1"></i>
                                {String(Math.floor(remainingValidSec / 60)).padStart(2, '0')}:{String(remainingValidSec % 60).padStart(2, '0')}
                            </span>
                        </div>

                        {verifiedAbaPayload ? (
                            <div className="mb-3 p-3 rounded-2xl bg-emerald-600 text-white shadow-lg flex items-center gap-2.5">
                                <i className="fa-solid fa-circle-check text-xl"></i>
                                <div>
                                    <div className="text-xs font-black">Payment Verified! Sending to Kitchen...</div>
                                    <div className="text-[10px] font-mono opacity-90">
                                        {verifiedAbaPayload.payerName} ({verifiedAbaPayload.maskedAccount}) • APV: {verifiedAbaPayload.apv}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="mb-3 p-2.5 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping ml-1"></span>
                                    <span className="text-[11px] font-bold text-emerald-900">Listening for ABA PayWay confirmation...</span>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => {
                                        // Simulate an incoming ABA PayWay message matching this exact order amount
                                        const msg = `៛${cartTotal.toLocaleString()} paid by CHE SOKUNTH ( *636 ) on Oct 22, 09:42 AM via ABA PAY at ${accountName}. Trx. ID: ${Date.now()}, APV: 884920.`;
                                        const parsed = window.SolarisKHQREngine.parseABAPayWayMessage(msg);
                                        window.SolarisKHQREngine.broadcastDetectedAbaPayment(parsed, cfg.paywayChatId);
                                    }}
                                    className="px-2.5 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-[10px] shrink-0 shadow-sm"
                                >
                                    <i className="fa-solid fa-bolt mr-1"></i>Simulate ABA Pay
                                </button>
                            </div>
                        )}

                        {/* Currency Switcher */}
                        <div className="mb-3 bg-stone-100 p-1 rounded-2xl border border-stone-200 flex gap-1">
                            <button
                                type="button"
                                onClick={() => setSelectedQrCurrency('KHR')}

                            >
                                🇰🇭 KHR ({Number(cartTotal).toLocaleString()} ៛)
                            </button>
                            <button
                                type="button"
                                onClick={() => setSelectedQrCurrency('USD')}
                                className={`flex-1 py-2 rounded-xl font-black text-xs transition ${selectedQrCurrency === 'USD' ? 'bg-emerald-600 text-white shadow-sm' : 'text-stone-600'}`}
                            >
                                🇺🇸 USD (${usdEquivalent})
                            </button>
                        </div>

                        {/* Official Red KHQR Card */}
                        <div className="w-full max-w-[280px] mx-auto rounded-3xl overflow-hidden shadow-xl border border-stone-200 bg-white mb-4">
                            <div className="bg-[#E1232E] text-white py-2.5 px-4 text-center font-black tracking-widest text-base">
                                KHQR • {selectedQrCurrency}
                            </div>
                            <div className="p-3.5 border-b border-dashed border-stone-200 bg-stone-50/50">

                                        {selectedQrCurrency === 'USD' ? `$${usdEquivalent}` : `${Number(cartTotal).toLocaleString()} ៛`}
                                    </div>
                                    <div className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                                        {selectedQrCurrency === 'USD' ? `≈ ${Number(cartTotal).toLocaleString()} ៛` : `≈ $${usdEquivalent}`}
                                    </div>
                                </div>
                            </div>
                            <div className="p-4 flex flex-col items-center bg-white">
                                {dynamicPayload ? (
                                    <img
                                        src={window.SolarisKHQREngine.renderInstantQRDataURL(dynamicPayload, 320, 2)}

                                        className="w-44 h-44 object-contain"
                                    />

                                        src={window.SolarisKHQREngine.renderInstantQRDataURL(`ABA PAY | ${accountName} | ${cartTotal} KHR`, 320, 2)}

            useEffect(() => {

                        <div className="flex items-center gap-2.5">
                            <span className="w-8 h-8 rounded-lg bg-[#E1232E] flex items-center justify-center font-black">
                                <i className="fa-solid fa-qrcode"></i>
                            </span>
                            <div>
                                <h1 className="font-black text-base leading-tight">Solaris KHQR & Payment (ABA) Source</h1>
                                <p className="text-[11px] text-stone-400">Extracted from Settings → Shop Property → KHQR & Payment (ABA)</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={() => setActiveTab('settings')}
                                className={`px-4 py-2 rounded-xl text-xs font-black transition ${activeTab === 'settings' ? 'bg-amber-500 text-stone-950 shadow' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'}`}
                            >
                                <i className="fa-solid fa-sliders mr-1.5"></i>1. KHQR Settings (Admin)
                            </button>
                            <button
                                onClick={() => setActiveTab('checkout_demo')}
                                className={`px-4 py-2 rounded-xl text-xs font-black transition ${activeTab === 'checkout_demo' ? 'bg-[#E1232E] text-white shadow' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'}`}
                            >
                                <i className="fa-solid fa-cart-shopping mr-1.5"></i>2. Test Customer Checkout & Remote Rule
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 p-4 sm:p-6">
                        {activeTab === 'settings' ? (
                            <KHQRPaymentSettingsView
                                shops={shops}
                                onUpdateShopConfig={handleUpdateShopConfig}
                            />
                        ) : (
                            <div className="max-w-lg mx-auto bg-white rounded-3xl p-6 shadow-sm border border-stone-200 space-y-5 animate-fade-in">
                                <div>
                                    <h2 className="text-xl font-black text-stone-900">Customer Checkout Simulator</h2>
                                    <p className="text-xs text-stone-500 mt-0.5">
                                        Tests how your saved settings (<code className="font-mono">enabled</code>, <code className="font-mono">requireRemoteKhqr</code>, <code className="font-mono">remoteThresholdMeters</code>) behave in the Customer Cart.
                                    </p>
                                </div>

                                {/* GPS Distance Slider to test "Require KHQR Payment for Remote Orders" */}
                                <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2">
                                    <div className="flex justify-between items-center text-xs font-bold">
                                        <span className="text-stone-600"><i className="fa-solid fa-location-crosshairs text-emerald-600 mr-1.5"></i>Simulated Customer GPS Distance:</span>
                                        <span className="font-mono font-black text-sm text-stone-900">{simulatedCustomerDistance}m from Shop</span>
                                    </div>
                                    <input
                                        type="range"
                                        min="10"
                                        max="500"
                                        step="10"
                                        value={simulatedCustomerDistance}
                                        onChange={e => setSimulatedCustomerDistance(Number(e.target.value))}
                                        className="w-full accent-red-600 cursor-pointer"
                                    />
                                    <div className="flex justify-between text-[10px] text-stone-400 font-bold">
                                        <span>10m (At Counter)</span>
                                        <span>Threshold: {activeBranchKhqrStatus.threshold || 100}m</span>
                                        <span>500m (Remote Order)</span>
                                    </div>
                                </div>

                                {/* Payment Method Selector (Exact logic from CartModal) */}
                                {activeBranchKhqrStatus.isKhqrEnabled ? (
                                    <div>
                                        <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">
                                            <i className="fa-solid fa-wallet mr-1.5 text-red-600"></i> Payment Method
                                        </label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setSelectedPaymentChoice('KHQR')}
                                                className={`py-3 px-3 rounded-xl font-bold text-xs border transition flex items-center justify-center gap-1.5 shadow-sm ${
                                                    selectedPaymentChoice === 'KHQR'
                                                        ? 'bg-[#E1232E] text-white border-[#E1232E]'
                                                        : 'bg-white text-stone-700 border-stone-300'
                                                }`}
                                            >
                                                <i className="fa-solid fa-qrcode"></i>
                                                <span>ABA KHQR</span>
                                            </button>
                                            <button
                                                type="button"
                                                disabled={activeBranchKhqrStatus.isRemoteKhqrRequired}
                                                onClick={() => !activeBranchKhqrStatus.isRemoteKhqrRequired && setSelectedPaymentChoice('COUNTER')}
                                                className={`py-3 px-3 rounded-xl font-bold text-xs border transition flex items-center justify-center gap-1.5 shadow-sm ${
                                                    activeBranchKhqrStatus.isRemoteKhqrRequired
                                                        ? 'bg-stone-100 text-stone-400 border-stone-200 cursor-not-allowed opacity-60'
                                                        : selectedPaymentChoice === 'COUNTER'
                                                            ? 'bg-stone-900 text-white border-stone-900'
                                                            : 'bg-white text-stone-700 border-stone-300'
                                                }`}
                                            >
                                                <i className="fa-solid fa-cash-register"></i>
                                                <span>Pay at Counter</span>
                                            </button>
                                        </div>

                                        {activeBranchKhqrStatus.isRemoteKhqrRequired && (
                                            <div className="mt-2.5 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs font-bold flex items-start gap-2">
                                                <i className="fa-solid fa-location-dot text-amber-600 mt-0.5"></i>
                                                <span>
                                                    Remote Order ({simulatedCustomerDistance}m &gt; {activeBranchKhqrStatus.threshold}m): ABA KHQR payment is required for orders outside the shop's immediate counter area.
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="p-3 rounded-xl bg-stone-100 text-stone-600 text-xs font-bold">
                                        KHQR Online Checkout is currently OFF in Settings. Only "Pay at Counter" is active.
                                    </div>
                                )}

                                <div className="pt-3 border-t border-stone-200 flex justify-between items-center">
                                    <span className="text-stone-500 font-bold text-sm">Sample Order Total</span>
                                    <span className="text-2xl font-black text-stone-900">12,000 ៛</span>
                                </div>

                                <button
                                    type="button"
                                    onClick={() => {
                                        if (activeBranchKhqrStatus.isKhqrEnabled && selectedPaymentChoice === 'KHQR') {
                                            setIsKhqrModalOpen(true);
                                        } else {
                                            setLastConfirmedOrder({ method: 'Pay at Counter', apv: null });
                                        }
                                    }}
                                    className={`w-full text-white font-black py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm ${
                                        activeBranchKhqrStatus.isKhqrEnabled && selectedPaymentChoice === 'KHQR'
                                            ? 'bg-[#E1232E] hover:bg-red-700'
                                            : 'bg-amber-600 hover:bg-amber-700'
                                    }`}
                                >
                                    {activeBranchKhqrStatus.isKhqrEnabled && selectedPaymentChoice === 'KHQR' ? (
                                        <><i className="fa-solid fa-qrcode"></i> Pay via ABA KHQR (12,000 ៛)</>
                                    ) : (
                                        <>Send to Kitchen (Pay at Counter)</>
                                    )}
                                </button>

                                {lastConfirmedOrder && (
                                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs space-y-1">
                                        <div className="font-black text-sm flex items-center gap-1.5">
                                            <i className="fa-solid fa-circle-check text-emerald-600"></i>
                                            Order Dispatched!
                                        </div>
                                        <div>Method: <b>{lastConfirmedOrder.method}</b></div>
                                        {lastConfirmedOrder.apv && <div>Verified APV: <b className="font-mono">{lastConfirmedOrder.apv}</b></div>}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {isKhqrModalOpen && (
                        <KHQRPaymentModal
                            shop={currentShop}
                            cartTotal={12000}
                            previewInvoiceNo="SLR-000000128"
                            onClose={() => setIsKhqrModalOpen(false)}
                            onConfirmPaid={(apvRef, verifiedAba) => {
                                setIsKhqrModalOpen(false);
                                setLastConfirmedOrder({
                                    method: verifiedAba ? `ABA PayWay Auto-Verified (${verifiedAba.payerName})` : 'ABA KHQR Confirmed',
                                    apv: apvRef || verifiedAba?.apv || 'N/A'
                                });
                            }}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
